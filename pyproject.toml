[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dclean"
version = "0.1.0"
description = "Quality check and cleaned-copy materialization for LeRobot v3.0 datasets"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dclean = "dclean.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dclean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

